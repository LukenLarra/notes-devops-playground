name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notes
          POSTGRES_PASSWORD: notes
          POSTGRES_DB: notes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U notes
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run migrations
        run: psql -h localhost -U notes -d notes -f migrations/001_create_notes_table.sql
        env:
          PGPASSWORD: notes

      - name: Unit tests
        run: go test ./internal/service/ -v

      - name: Integration tests
        run: go test ./internal/handlers/ -v ./internal/repository/ -v
        env:
          DATABASE_URL: postgres://notes:notes@localhost:5432/notes?sslmode=disable

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        run: go build ./cmd/api/

      - name: Build Docker image
        run: docker build .
