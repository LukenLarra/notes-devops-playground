<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-bar">
    <span class="material-icons">note</span>
    <span class="app-bar-title">Notes</span>
  </header>

  <main class="container">
    <div id="snackbar" class="snackbar" role="alert"></div>

    <div class="card">
      <div class="card-header">
        <span class="material-icons">edit_note</span>
        <h2 class="card-title" id="form-title">New Note</h2>
      </div>
      <form id="note-form">
        <div class="text-field">
          <label for="title" class="text-field-label">Title</label>
          <input type="text" id="title" required maxlength="255" class="text-field-input" placeholder="Enter a title for your note">
        </div>
        <div class="text-field">
          <label for="content" class="text-field-label">Content</label>
          <textarea id="content" required rows="3" class="text-field-input textarea" placeholder="Write your note content here"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn text-btn hidden" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn filled-btn" id="submit-btn">
            <span class="material-icons">add</span>
            Create
          </button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="material-icons">format_list_bulleted</span>
        <h2 class="card-title">All Notes</h2>
      </div>
      <div id="notes-list">
        <div class="empty-state">
          <span class="material-icons empty-icon">note_add</span>
          <p class="empty-text">Loading notes...</p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
